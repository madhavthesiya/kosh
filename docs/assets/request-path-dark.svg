<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img"><title>A request goes from the client through the event loop, parser, command table and storage to the AOF; replies follow the AOF write</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3987e5"/></marker></defs><rect x="8" y="24" width="152" height="92" rx="8" fill="#151b23" stroke="#3d444d"/><text x="84.0" y="66.0" fill="#f0f6fc" font-size="13.5" text-anchor="middle" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Clients</text><text x="84.0" y="84.0" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">RESP over TCP</text><rect x="186" y="24" width="152" height="92" rx="8" fill="#151b23" stroke="#3d444d"/><text x="262.0" y="58.0" fill="#f0f6fc" font-size="13.5" text-anchor="middle" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Event loop</text><text x="262.0" y="76.0" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">epoll or select(),</text><text x="262.0" y="92.0" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">per-client buffers</text><rect x="364" y="24" width="152" height="92" rx="8" fill="#151b23" stroke="#3d444d"/><text x="440.0" y="58.0" fill="#f0f6fc" font-size="13.5" text-anchor="middle" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">RESP parser</text><text x="440.0" y="76.0" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">binary-safe,</text><text x="440.0" y="92.0" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">with limits</text><rect x="542" y="24" width="152" height="92" rx="8" fill="#151b23" stroke="#3d444d"/><text x="618.0" y="58.0" fill="#f0f6fc" font-size="13.5" text-anchor="middle" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Command table</text><text x="618.0" y="76.0" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">shared by server</text><text x="618.0" y="92.0" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">and AOF replay</text><rect x="720" y="24" width="152" height="92" rx="8" fill="#151b23" stroke="#3d444d"/><text x="796.0" y="58.0" fill="#f0f6fc" font-size="13.5" text-anchor="middle" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Storage engine</text><text x="796.0" y="76.0" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">key table, SIEVE</text><text x="796.0" y="92.0" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">or LRU, TTLs</text><polyline points="160,70.0 184,70.0" fill="none" stroke="#9198a1" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="338,70.0 362,70.0" fill="none" stroke="#9198a1" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="516,70.0 540,70.0" fill="none" stroke="#9198a1" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="694,70.0 718,70.0" fill="none" stroke="#9198a1" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/><polyline points="796.0,116 796.0,166" fill="none" stroke="#9198a1" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/><rect x="720" y="168" width="152" height="74" rx="8" fill="#151b23" stroke="#3d444d"/><text x="796.0" y="193.0" fill="#f0f6fc" font-size="13.5" text-anchor="middle" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">AOF logger</text><text x="796.0" y="211.0" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">group commit: one</text><text x="796.0" y="227.0" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">write() per pass</text><polyline points="720,205 84.0,205 84.0,118" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" marker-end="url(#b)"/><text x="402.0" y="196" fill="#f0f6fc" font-size="13" text-anchor="middle" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Replies leave only after the records are with the OS</text></svg>
