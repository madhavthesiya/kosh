<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img"><title>A key table bucket holds tags and pointers; each entry is one allocation with the key inside; the eviction queue links the entries</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3987e5"/></marker></defs><text x="95" y="24" fill="#f0f6fc" font-size="14" text-anchor="start" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">A bucket: one 64-byte cache line</text><rect x="95" y="36" width="60" height="44" rx="4" fill="#14304f" stroke="#3987e5"/><text x="125" y="63" fill="#f0f6fc" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">meta</text><rect x="155" y="36" width="28" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="169" y="63" fill="#9198a1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">tag</text><rect x="183" y="36" width="28" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="197" y="63" fill="#9198a1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">tag</text><rect x="211" y="36" width="28" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="225" y="63" fill="#9198a1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">tag</text><rect x="239" y="36" width="28" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="253" y="63" fill="#9198a1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">tag</text><rect x="267" y="36" width="28" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="281" y="63" fill="#9198a1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">tag</text><rect x="295" y="36" width="28" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="309" y="63" fill="#9198a1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">tag</text><rect x="323" y="36" width="28" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="337" y="63" fill="#9198a1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">tag</text><rect x="351" y="36" width="62" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="382" y="63" fill="#9198a1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">pointer</text><rect x="413" y="36" width="62" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="444" y="63" fill="#9198a1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">pointer</text><rect x="475" y="36" width="62" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="506" y="63" fill="#9198a1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">pointer</text><rect x="537" y="36" width="62" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="568" y="63" fill="#9198a1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">pointer</text><rect x="599" y="36" width="62" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="630" y="63" fill="#9198a1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">pointer</text><rect x="661" y="36" width="62" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="692" y="63" fill="#9198a1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">pointer</text><rect x="723" y="36" width="62" height="44" rx="2" fill="#151b23" stroke="#3d444d"/><text x="754" y="63" fill="#9198a1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">pointer</text><text x="253" y="99" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">one byte of hash per slot</text><text x="568" y="99" fill="#9198a1" font-size="12" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">to entries, which never move; the last can point to a child bucket</text><polyline points="382,81 382,116 270,116 270,164" fill="none" stroke="#9198a1" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/><text x="90" y="142" fill="#f0f6fc" font-size="14" text-anchor="start" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">One allocation per key</text><rect x="90" y="166" width="200" height="46" rx="4" fill="#151b23" stroke="#3d444d"/><text x="190.0" y="194" fill="#f0f6fc" font-size="12.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">value</text><rect x="290" y="166" width="110" height="46" rx="4" fill="#151b23" stroke="#3d444d"/><text x="345.0" y="194" fill="#f0f6fc" font-size="12.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">expiry</text><rect x="400" y="166" width="170" height="46" rx="4" fill="#151b23" stroke="#3d444d"/><text x="485.0" y="194" fill="#f0f6fc" font-size="12.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">newer / older</text><rect x="570" y="166" width="70" height="46" rx="4" fill="#151b23" stroke="#3d444d"/><text x="605.0" y="194" fill="#9198a1" font-size="12.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">flags</text><rect x="640" y="166" width="150" height="46" rx="4" fill="#151b23" stroke="#3d444d"/><text x="715.0" y="194" fill="#f0f6fc" font-size="12.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">the key's bytes</text><polyline points="485.0,212 485.0,268" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" marker-end="url(#b)"/><text x="90" y="262" fill="#f0f6fc" font-size="14" text-anchor="start" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">The eviction queue runs through the entries</text><rect x="150" y="282" width="150" height="48" rx="8" fill="#151b23" stroke="#3d444d"/><text x="225.0" y="310.0" fill="#f0f6fc" font-size="13.5" text-anchor="middle" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">newest</text><rect x="345" y="282" width="150" height="48" rx="8" fill="#151b23" stroke="#3d444d"/><text x="420.0" y="310.0" fill="#f0f6fc" font-size="13.5" text-anchor="middle" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">…</text><rect x="540" y="282" width="150" height="48" rx="8" fill="#151b23" stroke="#3d444d"/><text x="615.0" y="310.0" fill="#f0f6fc" font-size="13.5" text-anchor="middle" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">oldest</text><polyline points="303,306 342,306" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" marker-end="url(#b)" marker-start="url(#b)"/><polyline points="498,306 537,306" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round" marker-end="url(#b)" marker-start="url(#b)"/><text x="440" y="358" fill="#9198a1" font-size="12.5" text-anchor="middle" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">No separate node: the links live inside the entry the lookup has already read</text></svg>
