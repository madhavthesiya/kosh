name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run it makes obsolete
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux, ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04's redis-server is 7.0.15, the version the compatibility
      # test compares against. The client versions are the ones tested locally.
      - name: Install Redis and the client libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          sudo systemctl stop redis-server || true
          python3 -m pip install --user --break-system-packages redis==8.1.0
          mkdir -p ~/node-clients && cd ~/node-clients && npm install --no-audit --no-fund redis@6.3.1
          echo "NODE_PATH=$HOME/node-clients/node_modules" >> "$GITHUB_ENV"
      - name: Build (warnings are errors)
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build -j
      # Each suite registers only if what it needs is found; here all must be
      - name: Check every test suite is registered
        # The list is read once: piping ctest into grep -q fails at random
        # under pipefail (grep exits at the first match, ctest gets SIGPIPE)
        run: |
          registered="$(ctest --test-dir build -N)"
          for t in unit_tests thread_safety_tests fuzz_corpus integration_tests integration_tests_select \
                   client_library_tests redis_compatibility; do
            grep -q " $t\$" <<< "$registered" || { echo "missing test: $t"; exit 1; }
          done
      # Integration tests run under epoll and again under select()
      - name: Test
        env:
          KOSH_REQUIRE_CLIENTS: "1"   # a missing client library fails, not skips
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Sanitizers (ASan + UBSan, TSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ASan + UBSan, every suite
        run: |
          cmake -B asan -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=address,undefined
          cmake --build asan -j
          ctest --test-dir asan --output-on-failure
      # setarch -R turns off address randomization (inherited by the server
      # the integration tests start): GCC 13's TSan fails with "unexpected
      # memory mapping" under the kernel's high mmap randomization otherwise.
      - name: TSan, unit, threads and integration
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -B tsan -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=thread
          cmake --build tsan -j --target tests test_threads kosh-server
          setarch "$(uname -m)" -R tsan/tests
          setarch "$(uname -m)" -R tsan/test_threads
          setarch "$(uname -m)" -R python3 tests/integration/test_server.py tsan/kosh-server

  windows-build:
    name: Windows build (MinGW-w64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix
      # Linked statically, so the .exe runs on a Windows machine without MinGW
      - name: Build (warnings are errors)
        run: |
          cmake -B build-mingw -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake \
                -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build-mingw -j
      - uses: actions/upload-artifact@v4
        with:
          name: kosh-server-windows
          path: build-mingw/kosh-server.exe

  windows-ports:
    name: Windows port checks
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kosh-server-windows
      - name: Port tests
        shell: powershell
        run: tests\windows\port_test.ps1 -Server kosh-server.exe

  static-analysis:
    name: Static analysis (clang-tidy, cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 clang-tidy-18 cppcheck
      # The checks, and why two are off, are in .clang-tidy; any finding fails
      - name: clang-tidy
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          run-clang-tidy-18 -quiet -p build -clang-tidy-binary clang-tidy-18 "^$PWD/[A-Za-z_]+\.cpp\$"
      - name: cppcheck
        run: |
          cppcheck --std=c++17 --language=c++ --enable=warning,performance,portability \
                   --inline-suppr --error-exitcode=1 -q -D__linux__ -U_WIN32 ./*.cpp

  fuzz:
    name: Fuzz (libFuzzer, ASan + UBSan) and corpus coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # libFuzzer and the sanitizer runtimes are in libclang-rt, which a plain
      # clang install can leave out; clang 18 named, so the tools match
      - name: Install clang 18 with its runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 libclang-rt-18-dev
      # Coverage-guided, with the RESP dictionary; new inputs go to found/,
      # an input that fails to crashes/ (uploaded below)
      - name: Fuzz for 2 minutes
        run: |
          cmake -B fuzz -DCMAKE_CXX_COMPILER=clang++-18 -DKOSH_LIBFUZZER=ON -DSANITIZE=address,undefined
          cmake --build fuzz -j --target fuzz_commands
          mkdir -p found crashes
          fuzz/fuzz_commands -dict=tests/fuzz/resp.dict -max_total_time=120 -timeout=10 \
                             -artifact_prefix=crashes/ -print_final_stats=1 found tests/fuzz/corpus
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crashes/
      # The standalone driver replays the seeds and what this run found,
      # instrumented for coverage: which lines the fuzzer reaches
      - name: Coverage of the corpus
        run: |
          llvm=/usr/lib/llvm-18/bin
          cmake -B cov -DCMAKE_CXX_COMPILER=clang++-18 \
                -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping"
          cmake --build cov -j --target fuzz_commands
          LLVM_PROFILE_FILE=cov.profraw cov/fuzz_commands tests/fuzz/corpus found
          "$llvm/llvm-profdata" merge -o cov.profdata cov.profraw
          sources=(RespParser.h Commands.cpp Integer.h InMemoryStorage.cpp KeyTable.h)
          "$llvm/llvm-cov" report cov/fuzz_commands -instr-profile=cov.profdata "${sources[@]}" | tee coverage.txt
          "$llvm/llvm-cov" show cov/fuzz_commands -instr-profile=cov.profdata -format=html \
                           -output-dir=coverage-html "${sources[@]}"
          cp coverage.txt coverage-html/
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-coverage
          path: coverage-html/

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t kosh .
      - name: Smoke test
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-tools
          docker run --rm kosh --version | grep -E '^kosh-server [0-9]+\.[0-9]+\.[0-9]+$'
          docker run -d --name protected -p 127.0.0.1:6400:6379 kosh
          docker run -d --name open -p 127.0.0.1:6401:6379 kosh --protected-mode no
          for name in protected open; do
            timeout 10 sh -c "until docker logs $name 2>&1 | grep -q 'listening on'; do sleep 0.2; done"
          done
          # No password: protected mode refuses a client from outside the container
          reply="$(redis-cli -p 6400 ping || true)"
          grep -q DENIED <<< "$reply"
          test "$(redis-cli -p 6401 ping)" = PONG
          test "$(docker top open -eo pid,uid | awk 'NR == 2 { print $2 }')" = 65532
          # SIGTERM to PID 1: a clean stop, not docker's kill after 10 s
          start=$(date +%s); docker stop open; end=$(date +%s)
          test "$(docker inspect -f '{{.State.ExitCode}}' open)" = 0
          test $((end - start)) -lt 5
